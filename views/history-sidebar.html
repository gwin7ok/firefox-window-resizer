<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <title>履歴を別ウィンドウで開く</title>
    <link rel="stylesheet" href="../styles/history-sidebar.css">
    <script src="../scripts/logger.js"></script>
    <script src="../scripts/store.js"></script>
    <script src="../views/history-groups.js"></script>
    <script src="../views/history-sidebar.js"></script>
</head>
<body>
    <div class="history-container">
        <input type="search" id="search-input" placeholder="履歴を検索" autocomplete="off">
        <div id="history-more-row" class="history-more-row" hidden>
            <button id="history-more" class="history-more">さらに読み込む</button>
            <button id="history-all" class="history-more">すべて読み込む</button>
        </div>
        <div id="history-status" class="history-status"></div>
        <ul id="history-list" class="history-list">
            <!-- 履歴はJavaScriptで動的に追加 -->
        </ul>
    </div>
</body>
</html>
